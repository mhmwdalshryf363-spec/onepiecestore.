<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قائمتي | One Piece Store</title><link rel="icon" href="logo.svg"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<div class="wrap" style="max-width:820px"><h2 class="sec-title">قائمتي</h2><p class="note" style="margin:-8px 0 18px">المنتجات التي حفظتها. اضغط "اشتري" لإتمام الطلب والدفع على موقع المتجر الأصلي. لا يتم أي دفع على هذا الموقع.</p><div id="list"></div><p id="empty" class="empty" hidden>قائمتك فارغة. <a href="products.html" style="color:#ff9800;font-weight:700">تصفح المنتجات</a></p></div>
<script src="app.js" data-base=""></script><script>
layout('cart');
function draw(){load().then(function(d){var ids=saved(),l=ids.map(function(i){return d.filter(function(x){return x.id===i})[0]}).filter(Boolean);$('#empty').hidden=l.length>0;
$('#list').innerHTML=l.map(function(p){return '<div class="row">'+thumb(p)+'<div class="info"><a href="product.html?id='+p.id+'"><b>'+esc(p.name)+'</b></a><div class="store">'+esc(CATS[p.category]||'')+(p.store?' - '+esc(STORES[p.store]||p.store):'')+'</div></div>'+buy(p)+'<button class="x" data-save="'+p.id+'" title="إزالة">✕</button></div>'}).join('')})}
$('#list').dataset.onsave='draw';bindSave($('#list'));draw();
</script></body></html>
